<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="content-type" content="text/html; charset=windows-1252">
     <title>A sample HTML5 two-column layout</title>
     
     <meta name="description" content="Don't forget to add a 1-2 sentence description here.">
     <meta name="keywords" content="Don't forget to add 20-30 important keywords here.">
     
     
    
     <link href="style.css" rel="stylesheet" type="text/css">
   	<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.2.0/jquery.min.js"></script>
     
</head>

<body>
  
  <div id="wrapper"> 
  
      <header>
      
        <div id="logo">  
        		
        		
        		<p><img src="cybop.svg" alt="Smiley face" width="100" height="100" align="left"> <br><h1>Cybop - Webstat Demo</h1>
        		Eine kleine Demo.
        		</p>
        		
        		        </div>
         
         <nav>
         
         <ul>
         <li ><a href="index.html">Startseite</a></li>
         <li><a href="#">Über</a></li>
         <li class="highlight"><a href="statistik.html">Statistik</a></li>
         </ul>
         
          </nav>
          
         
      </header>
      
     <div id="content">
     
     <h1>Webstatistik mit Cybop</h1>
     
     	 <div style="width:80%">
			<div>
				<canvas id="canvas" height="600" width="800"></canvas>
			</div>
		</div>
		
		
		
      </div> <!-- /end #content-->
      
      
       <div id="rightcol">
       
        <aside>
        
        <iframe src="counter.html">
  			<p>Your browser does not support iframes.</p>
		</iframe>
        
        </aside>
     
       </div>
      <!-- /end #rightcol-->
      

   </div> <!-- /end #wrapper-->
     <script>
	$(document).ready(function() {
		var description = new Array();
		var myvalues = new Array();
		$.ajax({
		    type: "GET",
		    url: "data.csv",
		    dataType: "text",
		    success: function(data) {
			    //alert("Data recived");
			    var allTextLines =  data.split(/\r\n|\n/);
			    for (var i=0; i<allTextLines.length; i++) {
					var entry = allTextLines[i].split(',');
					if( entry[0].length > 0){
						description.push(entry[0]);
						if( entry[1].length > 0){
							myvalues.push(entry[1]);
						}
						else{
							myvalues.push(0);
						}
					}
				}		    	
				var lineChartData = {
					labels : description,//["02.02.16","03.02.16","04.02.16","05.02.16","06.02.16","Gestern","Heute"],
					datasets : [
						{
							label: "My Second dataset",
							fillColor : "rgba(151,187,205,0.2)",
							strokeColor : "rgba(151,187,205,1)",
							pointColor : "rgba(151,187,205,1)",
							pointStrokeColor : "#fff",
							pointHighlightFill : "#fff",
							pointHighlightStroke : "rgba(151,187,205,1)",
							data : myvalues//[10,70,10,40,30,50,30]
						}
					]
				}
				var ctx = document.getElementById("canvas").getContext("2d");
				window.myLine = new Chart(ctx).Line(lineChartData, {
					responsive: true,
					scaleBeginAtZero: true
				});
		
		    }
		 });
	});
	</script>
  	<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/1.0.2/Chart.js"></script>
  	
</body></html>
